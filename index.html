<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Social Links Profile | Frontend Mentor</title>

  <!-- Styles -->
  <!-- Base -->
  <link rel="stylesheet" href="./assets/styles/base/variables.css" />
  <link rel="stylesheet" href="./assets/styles/base/reset.css" />
  <!-- Layout -->
  <link rel="stylesheet" href="./assets/styles/layout/page-layout.css">
  <!-- Components -->
  <link rel="stylesheet" href="./assets/styles/components/profile-card.css">

</head>
<body>
  <main>
    <article class="profile-card">
      <img class="profile-card__img" src="./assets/images/avatar-jessica.jpeg" width="88" height="88" alt="Portrait of Jessica Randall">
      <header class="profile-card__personal-info">
        <h1 class="profile-card__name">Jessica Randall</h1>
        <p class="profile-card__location">London, United Kingdom</p>
      </header>
      <p class="profile-card__bio">"Front-end developer and avid reader."</p>
      <nav class="profile-card__social-links" aria-label="Social media links">
        <ul class="profile-card__social-list">
          <li><a class="profile-card__social-link" href="#">GitHub</a></li>
          <li><a class="profile-card__social-link" href="#">Frontend Mentor</a></li>
          <li><a class="profile-card__social-link" href="#">LinkedIn</a></li>
          <li><a class="profile-card__social-link" href="#">Twitter</a></li>
          <li><a class="profile-card__social-link" href="#">Instagram</a></li>
        </ul>
      </nav>
    </article>
  </main>
</body>
</html>
